services:
  - type: web
    name: ai-intrusion-detection-backend
    runtime: python

    buildCommand: |
      python -m pip install --upgrade pip
      python -m pip install -r backend/requirements.txt

    startCommand: |
      python -m uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT

    healthCheckPath: /health

    envVars:
      - key: SECRET_KEY
        generateValue: true

      - key: FRONTEND_ORIGIN
        sync: false